<div class="alert-banner" role="alert" aria-live="assertive">
    <span class="alert-banner__icon" aria-hidden="true">!</span>
    <p class="alert-banner__message">{{ message() }}</p>
    <button type="button" class="alert-banner__close" aria-label="Cerrar mensaje de error" (click)="onDismiss()">
        &times;
    </button>
</div>
