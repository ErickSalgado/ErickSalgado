@if (isOpen()) {
<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-message"
    (click)="onBackdropClick($event)">
    <div class="modal-card">
        <div class="modal-card__body">
            <p id="confirm-modal-message" class="modal-card__message">{{ message() }}</p>
        </div>

        <div class="modal-card__actions">
            <button type="button" class="btn btn--secondary modal-card__button" [disabled]="isProcessing()"
                (click)="onCancel()">
                {{ cancelLabel() }}
            </button>

            <button type="button" class="btn btn--primary modal-card__button" [disabled]="isProcessing()"
                (click)="onConfirm()">
                {{ isProcessing() ? 'Eliminando...' : confirmLabel() }}
            </button>
        </div>
    </div>
</div>
}
