<div class="product-logo">
    @if (shouldShowImage()) {
    <img class="product-logo__image" [src]="normalizedUrl()" [alt]="'Logo de ' + productName()" loading="lazy"
        (error)="onImageError()" />
    } @else {
    <span class="product-logo__initials" aria-hidden="true">{{ initials() }}</span>
    }
</div>
